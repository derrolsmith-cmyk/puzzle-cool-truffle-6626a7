</style></head><body><header class="top"><div><div class="brand">Puzz<span>lé</span></div><div class="tag">Daily brain games · 2.2 preview</div></div><div class="topr"><button class="pill" id="scorePill">0 / 700</button><button class="pill" id="streakPill">🔥 0</button></div></header><main class="shell"><section id="home" class="screen active"><div class="hero"><div class="kicker">Today · September 7</div><h1>Your daily<br>brain buffet.</h1><p class="muted">Seven games · 100 points each · 700-point daily maximum.</p><div class="bar"><div id="barFill"></div></div><div class="progressline"><span id="completeText"></span><span id="dailyScore"></span></div></div><div id="gameCards" class="games"></div></section><section id="play" class="screen"><button class="back" onclick="show('home')">← Back to today</button><div id="gameMount"></div></section><section id="stats" class="screen"><h2>Stats</h2><div class="card"><div class="scorebox"><strong id="statsCompleted"></strong><strong id="statsScore"></strong></div></div></section></main><nav class="nav"><button data-v="home" class="active">Today</button><button data-v="play">Play</button><button data-v="stats">Stats</button></nav><div id="modal" class="modal"><div class="modalcard"><div class="kicker">Game complete</div><h2 id="modalTitle"></h2><p id="modalText" class="muted"></p><div id="shareText" class="share"></div><div class="actions"><button class="primary" id="copyBtn">Copy result</button><button class="secondary" onclick="closeModal()">Done</button></div></div></div><script>
const GAMES=[['mini','🧩','Mini','Crossword · Across & Down clues'],['groups','🟨','Groups','Find four hidden sets of four'],['five','🔤','Five','Guess the hidden five-letter word'],['crown','👑','Crown','Place six crowns by deduction'],['trail','🛤️','Trail','Build the valid path from 1 to 17'],['digits','🔢','Digits','A compact 6×6 Sudoku'],['shift','🪜','Shift','Solve a one-letter word ladder']].map(x=>({id:x[0],icon:x[1],name:x[2],desc:x[3]}));
let state=JSON.parse(localStorage.getItem('puzzle21')||'{"done":{},"score":0,"streak":0}'),activeGame=null;function save(){localStorage.setItem('puzzle21',JSON.stringify(state));renderHome()}function show(v){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v!=='play')activeGame=null}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function renderHome(){let n=Object.keys(state.done).length;barFill.style.width=n/7*100+'%';completeText.textContent=n+' of 7 complete';dailyScore.textContent=state.score+' / 700 pts';scorePill.textContent=state.score+' / 700';streakPill.textContent='🔥 '+(state.streak||0);statsCompleted.textContent=n+' / 7 complete';statsScore.textContent=state.score+' / 700';gameCards.innerHTML=GAMES.map(g=>`<button class="gamecard" onclick="openGame('${g.id}')"><div class="ico">${g.icon}</div><div><h3>${g.name}</h3><p>${g.desc}</p></div><div class="meta">${state.done[g.id]?'<span class="done">✓ '+state.done[g.id]+'/100</span>':'<span class="play">Play →</span>'}</div></button>`).join('')}function completeGame(id,score,detail){score=Math.max(0,Math.min(100,Math.round(score)));if(!state.done[id]){state.done[id]=score;state.score+=score;if(Object.keys(state.done).length===7)state.streak=(state.streak||0)+1;save()}let g=GAMES.find(x=>x.id===id);modalTitle.textContent=g.name+' complete';modalText.textContent=score+'/100 points · '+detail;shareText.textContent=`Puzzlé\n${g.icon} ${g.name} ✓ ${score}/100\nDaily: ${state.score}/700`;modal.classList.add('show')}function closeModal(){modal.classList.remove('show');show('home')}copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(shareText.textContent)}catch{}};function openGame(id){show('play');activeGame=id;({mini:renderMini,groups:renderGroups,five:renderFive,crown:renderCrown,trail:renderTrail,digits:renderDigits,shift:renderShift}[id])()}function head(i,n,s){return `<div class="gamehead"><div><h2>${i} ${n}</h2><p>${s}</p></div><strong>100 pts max</strong></div>`}function buildKeys(id,fn,back,enter){let e=document.getElementById(id);['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach((r,ri)=>{let row=document.createElement('div');row.className='kbdrow';[...r].forEach(l=>{let b=document.createElement('button');b.className='key';b.textContent=l;b.onclick=()=>fn(l);row.appendChild(b)});if(ri===2&&back){let b=document.createElement('button');b.className='key';b.textContent='⌫';b.onclick=back;row.appendChild(b)}if(ri===2&&enter){let b=document.createElement('button');b.className='key';b.textContent='↵';b.onclick=enter;row.appendChild(b)}e.appendChild(row)})}
const MINI=['STARE#','TIMER#','ARENA#','RECAP#','######','ALERTS'],MS=MINI.join('');const AC=['1. Look fixedly','6. Stopwatch reading','7. Sports venue','8. Summary','9. Notifications'];const DC=['1. One who remains','2. Subject or motif','3. Place for a contest','4. Brief written account','5. Warning messages'];let mt=[],mi=0,mdir='A';function miniNum(i){let r=Math.floor(i/6),c=i%6;if(MS[i]==='#')return'';let a=(c===0||MS[i-1]==='#')&&(c+1<6&&MS[i+1]!=='#'),d=(r===0||MS[i-6]==='#')&&(r+1<6&&MS[i+6]!=='#');let starts=[];for(let j=0,n=1;j<36;j++){if(MS[j]==='#')continue;let rr=Math.floor(j/6),cc=j%6,aa=(cc===0||MS[j-1]==='#')&&(cc+1<6&&MS[j+1]!=='#'),dd=(rr===0||MS[j-6]==='#')&&(rr+1<6&&MS[j+6]!=='#');if(aa||dd){if(j===i)return n;n++}}return''}function renderMini(){mt=Array(36).fill('');mi=0;mdir='A';gameMount.innerHTML=head('🧩','Mini','6×6 · type or tap · tap a cell again to switch Across/Down')+`<div id="mg" class="grid" style="grid-template-columns:repeat(6,1fr)"></div><div class="cluepanel"><div id="activeClue" class="activeclue">Across</div></div><div class="cluecols"><div><h4>Across</h4>${AC.map(x=>'<div>'+x+'</div>').join('')}</div><div><h4>Down</h4>${DC.map(x=>'<div>'+x+'</div>').join('')}</div></div><div id="mk" class="kbd"></div><div class="actions"><button class="primary" onclick="checkMini()">Check</button></div>`;[...MS].forEach((ch,i)=>{let d=document.createElement('div');d.className='xcell'+(ch==='#'?' block':'');if(ch!=='#'){let n=miniNum(i);d.innerHTML=(n?'<span class="xnum">'+n+'</span>':'')+'<span class="letter"></span>';d.onclick=()=>{if(mi===i)mdir=mdir==='A'?'D':'A';mi=i;paintMini()}}mg.appendChild(d)});buildKeys('mk',miniLetter,miniBack,checkMini);paintMini()}function nextMini(dir=1){let n=mi;do{n=(n+dir+36)%36}while(MS[n]==='#');mi=n}function miniLetter(l){mt[mi]=l.toUpperCase();nextMini(1);paintMini()}function miniBack(){if(!mt[mi])nextMini(-1);mt[mi]='';paintMini()}function miniMove(dr,dc){let r=Math.floor(mi/6),c=mi%6,n=Math.max(0,Math.min(5,r+dr))*6+Math.max(0,Math.min(5,c+dc));if(MS[n]!=='#'){mi=n;paintMini()}}function paintMini(){[...mg.children].forEach((d,i)=>{d.classList.toggle('sel',i===mi&&MS[i]!=='#');let l=d.querySelector('.letter');if(l)l.textContent=mt[i]||''});let r=Math.floor(mi/6),c=mi%6;activeClue.textContent=(mdir==='A'?'Across':'Down')+' · cell '+(r+1)+','+(c+1)}function checkMini(){[...MS].every((c,i)=>c==='#'||mt[i]===c)?completeGame('mini',100,'Clean solve'):alert('Not quite yet.')}
const GS=[['MERCURY','VENUS','EARTH','MARS'],['RED','BLUE','GREEN','YELLOW'],['BASS','TROUT','SALMON','TUNA'],['FORD','LINCOLN','HONDA','TOYOTA']];let gsel=[],gdone=[],gmiss=0;function renderGroups(){gsel=[];gdone=[];gmiss=0;let words=GS.flat().sort(()=>Math.random()-.5);gameMount.innerHTML=head('🟨','Groups','Four groups of four · mistakes reduce score')+`<div id="gstack"></div><div id="gwords" class="wordgrid"></div><div class="actions"><button class="primary" onclick="submitGroup()">Submit group</button><span class="muted" id="gm">0 mistakes</span></div>`;words.forEach(w=>{let b=document.createElement('button');b.className='wordchip';b.textContent=w;b.onclick=()=>{if(gsel.includes(w)){gsel=gsel.filter(x=>x!==w);b.classList.remove('sel')}else if(gsel.length<4){gsel.push(w);b.classList.add('sel')}};gwords.appendChild(b)})}function submitGroup(){if(gsel.length!==4)return;let hit=GS.findIndex((s,i)=>!gdone.includes(i)&&s.every(w=>gsel.includes(w)));if(hit<0){gmiss++;gm.textContent=gmiss+' mistakes';return}gdone.push(hit);let d=document.createElement('div');d.className='solvedgroup';d.textContent=GS[hit].join(' · ');gstack.appendChild(d);[...gwords.children].filter(b=>gsel.includes(b.textContent)).forEach(b=>b.remove());gsel=[];if(gdone.length===4)completeGame('groups',100-gmiss*10,gmiss+' mistakes')}
let fiveWord='CRANE',frow=0,fbuf='';function renderFive(){frow=0;fbuf='';gameMount.innerHTML=head('🔤','Five','Six tries · type or tap letters · Enter submits')+`<div id="fg"></div><div id="fk" class="kbd"></div>`;for(let r=0;r<6;r++){let row=document.createElement('div');row.className='guessrow';for(let c=0;c<5;c++){let t=document.createElement('div');t.className='tile';row.appendChild(t)}fg.appendChild(row)}buildKeys('fk',fiveLetter,fiveBack,submitFive)}function fiveLetter(l){if(fbuf.length<5){fbuf+=l.toUpperCase();paintFive()}}function fiveBack(){fbuf=fbuf.slice(0,-1);paintFive()}function paintFive(){let row=fg.children[frow];if(row)[...row.children].forEach((t,i)=>t.textContent=fbuf[i]||'')}function submitFive(){if(fbuf.length<5)return;let row=fg.children[frow];[...row.children].forEach((t,i)=>t.classList.add(fbuf[i]===fiveWord[i]?'hit':fiveWord.includes(fbuf[i])?'near':'miss'));if(fbuf===fiveWord)return completeGame('five',100-frow*8,(frow+1)+'/6 guesses');frow++;fbuf='';if(frow>=6)alert('Answer: CRANE')}
const CM=['#...#.','##...#','.##...','...###','##.##.','.#.#.#'];let crowns=new Set(),cmiss=0;function crownValid(set){if(set.size!==6)return false;let a=[...set].map(i=>[Math.floor(i/6),i%6]);if(new Set(a.map(x=>x[0])).size<6||new Set(a.map(x=>x[1])).size<6)return false;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(Math.abs(a[i][0]-a[j][0])<=1&&Math.abs(a[i][1]-a[j][1])<=1)return false;return true}function renderCrown(){crowns=new Set();cmiss=0;gameMount.innerHTML=head('👑','Crown','Medium · one crown per row and column · crowns cannot touch')+`<p class="muted">Dark cells are unavailable.</p><div id="cg" class="logicgrid" style="grid-template-columns:repeat(6,1fr)"></div><div class="actions"><button class="primary" onclick="checkCrown()">Check crowns</button><span class="muted" id="cm">0 checks</span></div>`;CM.forEach((r,ri)=>[...r].forEach((v,c)=>{let i=ri*6+c,d=document.createElement('button');d.className='lcell'+(v==='#'?' blocked':'');d.textContent=v==='#'?'×':'';if(v!=='#')d.onclick=()=>{crowns.has(i)?crowns.delete(i):crowns.add(i);d.classList.toggle('crown',crowns.has(i));d.textContent=crowns.has(i)?'👑':''};cg.appendChild(d)}))}function checkCrown(){cmiss++;cm.textContent=cmiss+' checks';if(crownValid(crowns))completeGame('crown',100-Math.max(0,cmiss-1)*5,'Unique solution found');else alert('Not yet.')}
const TP=[[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[2,3],[2,2],[2,1],[2,0],[3,0],[4,0],[4,1],[4,2],[4,3],[4,4]],TSET=new Set(TP.map(([r,c])=>r*5+c));let trail=[];function renderTrail(){trail=[];gameMount.innerHTML=head('🛤️','Trail','Validated 17-cell route · connect checkpoints in order')+`<p class="muted">Start at 1. Reach 7, then 17.</p><div id="tg" class="logicgrid" style="grid-template-columns:repeat(5,1fr)"></div><div class="actions"><button class="secondary" onclick="renderTrail()">Reset</button></div>`;for(let i=0;i<25;i++){let d=document.createElement('button'),pos=TP.findIndex(([r,c])=>r*5+c===i);d.className='lcell'+(TSET.has(i)?'':' blocked');if(pos===0)d.textContent='1';if(pos===6)d.textContent='7';if(pos===16)d.textContent='17';if(TSET.has(i))d.onclick=()=>trailClick(i,d);tg.appendChild(d)}}function trailClick(i,d){let expected=TP[trail.length][0]*5+TP[trail.length][1];if(i!==expected)return alert('That breaks the route.');trail.push(i);d.classList.add('path');let n=trail.length;if(![1,7,17].includes(n))d.textContent=n;if(n===17)completeGame('trail',100,'Valid route completed')}
const DS=[[1,0,0,4,0,6],[0,5,6,0,2,0],[2,0,4,0,6,1],[0,6,0,2,0,4],[3,0,5,6,0,2],[6,1,0,0,4,0]],DA=[[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,4,5,6,1],[5,6,1,2,3,4],[3,4,5,6,1,2],[6,1,2,3,4,5]];function renderDigits(){gameMount.innerHTML=head('🔢','Digits','6×6 Sudoku · type numbers 1–6')+`<div id="dg" class="sudoku"></div><div class="actions"><button class="primary" onclick="checkDigits()">Check</button></div>`;DS.forEach((r,ri)=>r.forEach((v,c)=>{let d=document.createElement(v?'div':'input');d.className='scell'+(v?' given':'');d.dataset.r=ri;d.dataset.c=c;if(v)d.textContent=v;else{d.inputMode='numeric';d.maxLength=1;d.style.width='100%';d.style.textAlign='center';d.oninput=()=>d.value=d.value.replace(/[^1-6]/g,'').slice(-1)}dg.appendChild(d)}))}function checkDigits(){let ok=true;[...dg.children].forEach(d=>{let r=+d.dataset.r,c=+d.dataset.c,v=d.tagName==='INPUT'?+d.value:+d.textContent;if(v!==DA[r][c])ok=false});ok?completeGame('digits',100,'Grid solved'):alert('A few cells still need work.')}
const LAD=[['COLD',''],['CORD','Rope'],['CARD','Wallet item'],['WARD','Hospital section'],['WARM','']];function renderShift(){gameMount.innerHTML=head('🪜','Shift','Change exactly one letter per row. Every row must form a word.')+`<div id="lg" class="ladder"><div class="endpoint">START · COLD</div></div><div class="actions"><button class="primary" onclick="checkShift()">Check ladder</button></div>`;LAD.slice(1,4).forEach((x,i)=>{let d=document.createElement('div');d.className='ladrow';d.innerHTML=`<input data-i="${i+1}" maxlength="4" placeholder="_ _ _ _"><span class="muted">${x[1]}</span>`;lg.appendChild(d)});let end=document.createElement('div');end.className='endpoint';end.textContent='FINISH · WARM';lg.appendChild(end);let ins=[...lg.querySelectorAll('input')];ins.forEach((x,i)=>{x.oninput=()=>x.value=x.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,4);x.onkeydown=e=>{if(e.key==='Enter'){if(i<ins.length-1)ins[i+1].focus();else checkShift()}}});if(ins[0])ins[0].focus()}function checkShift(){let vals=['COLD',...[...lg.querySelectorAll('input')].map(x=>x.value.toUpperCase()),'WARM'];vals.every((v,i)=>v===LAD[i][0])?completeGame('shift',100,'Word ladder solved'):alert('Not quite. Change exactly one letter each row.')}
window.addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;if(activeGame==='mini'){if(/^[a-z]$/i.test(e.key)){e.preventDefault();miniLetter(e.key)}else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();miniBack()}else if(e.key==='Enter'){e.preventDefault();checkMini()}else if(e.key==='ArrowLeft')miniMove(0,-1);else if(e.key==='ArrowRight')miniMove(0,1);else if(e.key==='ArrowUp')miniMove(-1,0);else if(e.key==='ArrowDown')miniMove(1,0)}else if(activeGame==='five'){if(/^[a-z]$/i.test(e.key)){e.preventDefault();fiveLetter(e.key)}else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();fiveBack()}else if(e.key==='Enter'){e.preventDefault();submitFive()}}});renderHome();</script></body></html>
