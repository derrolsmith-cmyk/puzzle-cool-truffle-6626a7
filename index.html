iss+' mistake'+(s.miss===1?'':'s'));renderGroupie()}
let wordAnswer='CRANE';function renderWordle(){let s=gs('wordle',{guesses:[],buf:''});gameMount.innerHTML=head('🔤','Wordlé','Six tries · fewer guesses score better')+`<div id="wg"></div><div id="wk" class="kbd"></div>`;for(let r=0;r<6;r++){let row=document.createElement('div');row.className='guessrow';let text=s.guesses[r]||((r===s.guesses.length)?s.buf:'');for(let c=0;c<5;c++){let t=document.createElement('div');t.className='tile';t.textContent=text[c]||'';if(s.guesses[r])t.classList.add(text[c]===wordAnswer[c]?'hit':wordAnswer.includes(text[c])?'near':'miss');row.appendChild(t)}wg.appendChild(row)}buildKeys('wk',wordLetter,wordBack,submitWord)}function wordLetter(l){let s=gs('wordle',{});if(s.buf.length<5)s.buf+=l.toUpperCase();save();renderWordle()}function wordBack(){let s=gs('wordle',{});s.buf=s.buf.slice(0,-1);save();renderWordle()}function submitWord(){let s=gs('wordle',{});if(s.buf.length<5)return;let g=s.buf;s.guesses.push(g);s.buf='';save();if(g===wordAnswer)return completeGame('wordle',100-(s.guesses.length-1)*7,s.guesses.length+'/6 guesses');if(s.guesses.length>=6)completeGame('wordle',55,'Answer was CRANE');else renderWordle()}
const RM=['#...#.','##...#','.##...','...###','##.##.','.#.#.#'];function reignValid(set){if(set.size!==6)return false;let a=[...set].map(i=>[Math.floor(i/6),i%6]);if(new Set(a.map(x=>x[0])).size<6||new Set(a.map(x=>x[1])).size<6)return false;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(Math.abs(a[i][0]-a[j][0])<=1&&Math.abs(a[i][1]-a[j][1])<=1)return false;return true}function renderReign(){let s=gs('reign',{crowns:[],miss:0});gameMount.innerHTML=head('👑','Reign','One crown per row and column · crowns cannot touch')+`<p class="muted">Dark cells are unavailable. Incorrect checks cost 5 points.</p><div id="rg" class="logicgrid" style="grid-template-columns:repeat(6,1fr)"></div><div class="actions"><button class="primary" onclick="checkReign()">Check crowns</button><span class="muted">${s.miss} checks</span></div>`;RM.forEach((r,ri)=>[...r].forEach((v,c)=>{let i=ri*6+c,d=document.createElement('button'),on=s.crowns.includes(i);d.className='lcell'+(v==='#'?' blocked':'')+(on?' crown':'');d.textContent=v==='#'?'×':on?'👑':'';if(v!=='#')d.onclick=()=>{on?s.crowns=s.crowns.filter(x=>x!==i):s.crowns.push(i);save();renderReign()};rg.appendChild(d)}))}function checkReign(){let s=gs('reign',{});if(reignValid(new Set(s.crowns)))return completeGame('reign',100-s.miss*5,'Crown grid solved');s.miss++;save();renderReign();alert('Not yet.')}
const LAD=[['COLD',''],['CORD','Rope'],['CARD','Wallet item'],['WARD','Hospital section'],['WARM','']];let wordTimer=null;function renderWordUp(){let s=gs('wordup',{start:Date.now(),vals:['','','']});clearInterval(wordTimer);gameMount.innerHTML=head('🪜','Word Up','Change exactly one letter each step','<span class="timer" id="wut"></span>')+`<div id="lg" class="ladder"><div class="endpoint">START · COLD</div></div><div class="actions"><button class="primary" onclick="checkWordUp()">Check ladder</button></div>`;LAD.slice(1,4).forEach((x,i)=>{let d=document.createElement('div');d.className='ladrow';d.innerHTML=`<input data-i="${i}" maxlength="4" value="${s.vals[i]}" placeholder="_ _ _ _"><span class="muted">${x[1]}</span>`;lg.appendChild(d)});lg.insertAdjacentHTML('beforeend','<div class="endpoint">FINISH · WARM</div>');[...lg.querySelectorAll('input')].forEach(x=>x.oninput=()=>{s.vals[+x.dataset.i]=x.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,4);x.value=s.vals[+x.dataset.i];save()});let tick=()=>{let sec=Math.floor((Date.now()-s.start)/1000);if(wut)wut.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};tick();wordTimer=setInterval(tick,1000)}function checkWordUp(){let s=gs('wordup',{}),vals=['COLD',...s.vals,'WARM'];if(!vals.every((v,i)=>v===LAD[i][0]))return alert('Not quite. Change exactly one letter each row.');clearInterval(wordTimer);let sec=Math.floor((Date.now()-s.start)/1000),bonus=sec<=30?30:sec<=60?25:sec<=90?20:sec<=120?15:sec<=180?10:5;completeGame('wordup',70+bonus,'Solved in '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'))}
window.addEventListener('keydown',e=>{if(document.activeElement?.tagName==='INPUT')return;if(activeGame==='crossle'){if(/^[a-z]$/i.test(e.key)){e.preventDefault();crossLetter(e.key)}else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();crossBack()}}else if(activeGame==='wordle'){if(/^[a-z]$/i.test(e.key)){e.preventDefault();wordLetter(e.key)}else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();wordBack()}else if(e.key==='Enter')submitWord()}});renderHome();
</script></body></html>
